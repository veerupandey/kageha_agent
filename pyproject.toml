[build-system]
requires = ["uv_build>=0.11.7,<0.12.0"]
build-backend = "uv_build"

[project]
name = "kageha"
version = "0.4.0a1"
description = "Kageha — trimmed agent kernel (loop + MCP + Agent Skills + memory)"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Kageha" }]
dependencies = [
  "httpx>=0.27",
  "pydantic>=2.7",
  "PyYAML>=6.0",
  "typer>=0.12",
  "rich>=13.7",
  "python-dotenv>=1.0",
]

[project.optional-dependencies]
browser = ["playwright>=1.44"]
pdf = ["pypdf>=4.0"]
computer = [
  "pyautogui>=0.9",
  "pillow>=10",
]  # PyAutoGUI = pixel fallback only; install cua-driver via scripts/install_computer_driver.sh
# Phase E stub: empty until crates/kageha-index (maturin/PyO3) ships.
# Façade: kageha.native — pure Python until warm @ query p95 > 20ms.
# Force Python anytime: KAGEHA_NATIVE_INDEX=0
"native-index" = []
zvec = ["zvec>=0.1"]
graphrag = ["vector-graph-rag>=0.2"]
otel = [
  "opentelemetry-api>=1.25",
  "opentelemetry-sdk>=1.25",
  "opentelemetry-exporter-otlp-proto-http>=1.25",
]
channels = ["aiohttp>=3.9"]
discord = ["discord.py>=2.3"]
slack = ["slack-bolt>=1.18"]
signal = []  # uses httpx + external signal-cli daemon
matrix = []  # Client-Server sync via httpx
"matrix-e2ee" = ["matrix-nio[e2e]>=0.25"]  # Olm/Megolm (needs libolm on host)
email = []  # stdlib imaplib/smtplib; Gmail OAuth via connections extra
imessage = ["aiohttp>=3.9"]  # BlueBubbles webhook (+ httpx send)
irc = []  # asyncio TCP
mattermost = []  # httpx REST
teams = ["aiohttp>=3.9"]
setup = ["textual>=0.80"]
mcp = ["mcp>=1.6,<2"]
sandbox = ["modal>=0.64"]
server-ws = ["websockets>=12"]
connections = [
  "google-auth>=2.29",
  "google-auth-oauthlib>=1.2",
  "google-auth-httplib2>=0.2",
]
gmail = [
  "google-auth>=2.29",
  "google-auth-oauthlib>=1.2",
  "google-auth-httplib2>=0.2",
]
all = [
  "aiohttp>=3.9",
  "discord.py>=2.3",
  "google-auth>=2.29",
  "google-auth-oauthlib>=1.2",
  "google-auth-httplib2>=0.2",
  "matrix-nio[e2e]>=0.25",
  "mcp>=1.6,<2",
  "modal>=0.64",
  "opentelemetry-api>=1.25",
  "opentelemetry-sdk>=1.25",
  "opentelemetry-exporter-otlp-proto-http>=1.25",
  "pillow>=10",
  "playwright>=1.44",
  "pyautogui>=0.9",
  "pypdf>=4.0",
  "slack-bolt>=1.18",
  "textual>=0.80",
  "vector-graph-rag>=0.2",
  "zvec>=0.1",
]

[dependency-groups]
dev = [
  "hypothesis>=6.112",
  "pillow>=10",
  "pypdf>=4.0",
  "pytest>=8.0",
  "pytest-asyncio>=0.23",
  "pytest-cov>=5.0",
  "pyright>=1.1.380",
  "ruff>=0.6.5",
]

[project.scripts]
kageha = "kageha.cli:app"

[project.entry-points."kageha.tools"]
core = "kageha.harness.tools.builtin:register"

[project.entry-points."kageha.kb_engines"]
zvec = "kageha.knowledge.zvec_engine:ZvecEngine"
vgrag = "kageha.knowledge.vgrag_engine:VgragEngine"

[project.entry-points."kageha.channels"]
telegram = "kageha.channels.telegram:TelegramChannel"
whatsapp = "kageha.channels.whatsapp:WhatsAppChannel"
whatsapp_qr = "kageha.channels.whatsapp_qr:WhatsAppQRChannel"
discord = "kageha.channels.discord:DiscordChannel"
slack = "kageha.channels.slack:SlackChannel"
signal = "kageha.channels.signal:SignalChannel"
matrix = "kageha.channels.matrix:MatrixChannel"
email = "kageha.channels.email:EmailChannel"
imessage = "kageha.channels.imessage:iMessageChannel"
irc = "kageha.channels.irc:IRCChannel"
mattermost = "kageha.channels.mattermost:MattermostChannel"
teams = "kageha.channels.teams:TeamsChannel"

[tool.uv]
default-groups = ["dev"]
package = true
required-version = ">=0.11.0"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
  "live_provider: billed integration tests for configured model providers",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.pyright]
pythonVersion = "3.11"
typeCheckingMode = "basic"
include = ["src/kageha"]
exclude = ["bridges", "outputs"]
reportMissingTypeStubs = false
reportUnknownMemberType = false
reportUnknownArgumentType = false
reportUnknownVariableType = false

[tool.coverage.run]
branch = true
source = ["kageha"]

[tool.coverage.report]
show_missing = true
skip_covered = true
