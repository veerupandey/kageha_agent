name: CI

on:
  push:
    branches: [main, "research/*", "feat/*"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.11"
          enable-cache: true
          python-version: "3.11"
      - run: uv sync --locked --all-extras --dev
      - run: uv run ruff check .
      - run: >-
          uv run ruff format --check
          src/kageha/channels tests/test_channels.py

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.11"
          enable-cache: true
          python-version: "3.11"
      - run: uv sync --locked --all-extras --dev
      - run: uv run pyright

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.11", "3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.11"
          enable-cache: true
          python-version: ${{ matrix.python }}
      - run: uv sync --locked --all-extras --dev
      - run: uv run pytest -q --tb=short
      - run: uv build

  runtime-coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.11"
          enable-cache: true
          python-version: "3.11"
      - run: uv sync --locked --all-extras --dev
      - name: Runtime coverage gate (≥80% branch)
        run: >-
          uv run pytest -q tests/test_runtime.py tests/test_runtime_platform.py tests/test_channels.py
          --cov=kageha.runtime
          --cov-branch
          --cov-fail-under=80

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/kageha/webui/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: src/kageha/webui/frontend/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run lint
      - run: npm run test
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: webui-dist
          path: src/kageha/webui/frontend/dist/
          retention-days: 7
