name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.11", "3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.11"
          enable-cache: true
          python-version: ${{ matrix.python }}
      - run: uv sync --locked --all-extras --dev
      - run: uv run ruff check .
      - run: uv run pyright
      - run: uv build
      - run: uv run pytest -q

  runtime-coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.11"
          enable-cache: true
          python-version: "3.11"
      - run: uv sync --locked --all-extras --dev
      - name: Runtime line and branch coverage gate
        run: >-
          uv run pytest -q tests/test_runtime.py tests/test_runtime_platform.py
          --cov=kageha.runtime
          --cov-branch
          --cov-fail-under=85
